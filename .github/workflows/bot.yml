name: f1-bot

on:
  schedule:
    # каждые 15 минут (UTC); публикации решает сам бот по времени Europe/Moscow
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: f1-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot cycle
        run: python bot/actions_entry.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
